<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>じぶん日めくり スクリーンショット台紙</title>
<!-- App Store 用スクリーンショットの台紙。tools/make-screenshots.mjs が開いて撮影する（手で開いても見られる: ?iw=430&ih=839&scene=today） -->
<style>
  :root { --wall: #ebe6dc; --wall2: #ddd6c8; --ink: #2a2724; --ink2: #6f675c; --accent: #c8452c; }
  html, body { margin: 0; height: 100%; }
  body { overflow: hidden; display: flex; flex-direction: column; align-items: center; background: var(--wall); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background-image: radial-gradient(circle at 50% 0%, #f6f2ea 0%, var(--wall) 55%, var(--wall2) 100%); }
  body.night { --wall: #17161a; --wall2: #0f0e11; --ink: #ece8e0; --ink2: #a39d92; --accent: #d7a645;
    background-image: radial-gradient(circle at 50% 0%, #24222a 0%, var(--wall) 55%, var(--wall2) 100%); }
  .cap { text-align: center; padding: 0 7vw; box-sizing: border-box; width: 100%; }
  .cap h1 { margin: 0; font-weight: 800; line-height: 1.35; letter-spacing: .06em; word-break: keep-all; overflow-wrap: anywhere; }
  .cap p { margin: .55em 0 0; color: var(--ink2); letter-spacing: .08em; word-break: keep-all; overflow-wrap: anywhere; font-weight: 600; }
  .cap .rule { width: 2.2em; height: 3px; background: var(--accent); margin: .7em auto 0; border-radius: 3px; }
  .device { position: relative; overflow: hidden; background: #ebe6dc; box-shadow: 0 50px 90px -30px rgba(40,30,10,.45), 0 0 0 1px rgba(40,30,10,.10); }
  body.night .device { background: #17161a; box-shadow: 0 50px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(236,232,224,.16); }
  .device iframe { border: 0; display: block; transform-origin: 0 0; }
</style>
</head>
<body>
<div class="cap"><h1 id="h"></h1><p id="p"></p><div class="rule"></div></div>
<div class="device" id="dev"><iframe id="app" title="じぶん日めくり"></iframe></div>
<script>
const q = new URLSearchParams(location.search);
const iw = +q.get('iw') || 430, ih = +q.get('ih') || 839; // アプリの表示領域（その端末での CSS ピクセル）
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const today = (() => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; })();
function shift(months, years, days) { const [y, m, d] = today.split('-').map(Number); const t = new Date(y - (years || 0), m - 1 - (months || 0), d - (days || 0)); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; }

// 撮影用のカード。音は消しておく。初回案内は済ませた状態にする
const CARDS = [
  { id: 'c1', text: '今日は、昨日より少しだけ。', sub: '自分への言葉', kind: 'any' },
  { id: 'c2', text: '急がなくていい。\n止まらなければいい。', sub: '', kind: 'any' },
  { id: 'c3', text: '迷ったら、あとで笑えるほうへ。', sub: '', kind: 'any' },
  { id: 'c4', text: '深呼吸ひとつぶんの余裕を。', sub: '', kind: 'any' },
  { id: 'c5', text: '言えなかった「ありがとう」は、まだ間に合う。', sub: '母の口ぐせ', kind: 'any' },
  { id: 'c6', text: '今週は、ひとつだけ決めて動く。', sub: '', kind: 'wday', wdays: [1] },
  { id: 'c7', text: '今週のよかったことを、3つ。', sub: '', kind: 'wday', wdays: [5] },
  { id: 'c8', text: '誕生日おめでとう。\n今年も、よく笑う1年に。', sub: '', kind: 'date', date: '04-12' },
  { id: 'photo1', text: '夕焼けの日', sub: '2019年の夏、家族で', kind: 'any' },
];
function seedState(sc) {
  const cards = CARDS.map((c, i) => ({ id: c.id, text: c.text, sub: c.sub || '', kind: c.kind, date: c.date || null, wdays: c.wdays || [], order: i, createdAt: 1760000000000 + i * 86400000, img: c.id === 'photo1' }));
  const notes = {};
  if (sc.notes) {
    notes[today] = sc.notes.today || '';
    notes[shift(0, 1)] = '久しぶりに早起きした。空気が澄んでいた。';
    notes[shift(1, 0)] = '金木犀の匂い。今年もこの季節。';
    notes[shift(0, 0, 7)] = '仕事が一段落。来週は少し休もう。';
    notes[shift(0, 0, 1)] = '新しい傘を買った。雨が楽しみになった。';
    if (!notes[today]) delete notes[today];
  }
  if (sc.calendar) {
    const lines = ['よく寝た。', '帰りに本屋へ。', '雨。家で音楽。', '友だちと長電話。', '少し走った。', '夕焼けがきれいだった。', '早めに寝る。', '新しいレシピに挑戦。', '散歩で猫に会った。', '仕事が片づいた。', '映画を観た。', 'なんでもない1日。それがいい。'];
    const [y, m, d] = today.split('-').map(Number);
    let k = 0;
    for (let day = 1; day <= d; day++) { if ([3, 6, 10, 13, 17, 20, 21, 22, 24, 25].includes(day) || day === d) { notes[`${y}-${pad(m)}-${pad(day)}`] = lines[k++ % lines.length]; } }
    for (let i = 1; i <= 9; i++) notes[shift(0, 0, d - 1 + i)] = lines[(k + i) % lines.length];
  }
  const shown = {}; shown[today] = sc.card || 'c1';
  if (sc.calendar) { const [y, m, d] = today.split('-').map(Number); for (let day = 1; day < d; day++) shown[`${y}-${pad(m)}-${pad(day)}`] = CARDS[day % 5].id; for (let i = 1; i <= 9; i++) shown[shift(0, 0, d - 1 + i)] = CARDS[i % 5].id; }
  return { v: 1, cards, notes, shown, overrides: { [today]: sc.card || 'c1' },
    settings: Object.assign({ paper: 'white', font: 'gothic', size: 'm', accent: 'shu', vert: false, mode: 'random', sound: false, haptic: false, theme: 'light', notify: true, notifyTime: '07:30', seed: 'shot' }, sc.settings || {}),
    meta: { lastOpenDate: today, onboarded: true, seeded: true, createdAt: 1760000000000, hintShown: sc.hint ? 0 : 5, widgetFull: true } };
}

// 写真カード用の絵（夕焼け）。写真素材を持ち込まず、その場で描く
function makePhoto() {
  const cv = document.createElement('canvas'); cv.width = 1000; cv.height = 700; const g = cv.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, 700); sky.addColorStop(0, '#2b2a5a'); sky.addColorStop(.35, '#b4476a'); sky.addColorStop(.62, '#f08a4b'); sky.addColorStop(.8, '#f7c66b'); sky.addColorStop(1, '#f9e3a0');
  g.fillStyle = sky; g.fillRect(0, 0, 1000, 700);
  const glow = g.createRadialGradient(620, 470, 10, 620, 470, 260); glow.addColorStop(0, 'rgba(255,240,200,.95)'); glow.addColorStop(.3, 'rgba(255,200,120,.55)'); glow.addColorStop(1, 'rgba(255,200,120,0)');
  g.fillStyle = glow; g.fillRect(0, 0, 1000, 700);
  g.fillStyle = '#fff3c4'; g.beginPath(); g.arc(620, 470, 46, 0, Math.PI * 2); g.fill();
  for (const [x, w, a] of [[120, 260, .18], [430, 180, .14], [760, 220, .12]]) { g.fillStyle = `rgba(90,40,70,${a})`; g.beginPath(); g.ellipse(x, 300, w, 22, 0, 0, Math.PI * 2); g.fill(); }
  g.fillStyle = '#3a2a3e'; g.beginPath(); g.moveTo(0, 560); g.bezierCurveTo(200, 500, 350, 540, 520, 520); g.bezierCurveTo(700, 500, 850, 560, 1000, 530); g.lineTo(1000, 700); g.lineTo(0, 700); g.fill();
  g.fillStyle = '#241a29'; g.beginPath(); g.moveTo(0, 620); g.bezierCurveTo(250, 590, 450, 640, 700, 600); g.bezierCurveTo(850, 580, 950, 620, 1000, 610); g.lineTo(1000, 700); g.lineTo(0, 700); g.fill();
  g.strokeStyle = '#241a29'; g.lineWidth = 3; g.lineCap = 'round';
  for (const [x, y, s] of [[300, 200, 14], [340, 180, 10], [820, 150, 12]]) { g.beginPath(); g.moveTo(x - s, y); g.quadraticCurveTo(x - s / 2, y - s / 2, x, y); g.quadraticCurveTo(x + s / 2, y - s / 2, x + s, y); g.stroke(); }
  return cv.toDataURL('image/jpeg', .9);
}

const SCENES = {
  today:    { h: '毎朝、1枚めくれる', p: '好きな言葉を、あなたの日めくりに', card: 'c1', hint: true, run: async w => {} },
  photo:    { h: '写真も、1枚のカードに', p: '家族の写真、旅の空、思い出の一枚', card: 'photo1', settings: { paper: 'sora', accent: 'ai' },
              run: async w => { await w.putImage('photo1', makePhoto()); w.renderToday(); } },
  memories: { h: '1行だけ、書く', p: '来週・来月・来年の今日に、届く', card: 'c4', notes: { today: '今日はよく笑った。いい日。' }, settings: { paper: 'washi', accent: 'matsu', font: 'mincho' }, compact: true, run: async w => {} },
  cards:    { h: 'カードは、自分で作る', p: '記念日に。曜日に。いつでも', card: 'c3', settings: { accent: 'shu' },
              run: async w => { await w.putImage('photo1', makePhoto()); w.show('cards'); } },
  log:      { h: '積もっていく、ひとこと', p: 'カレンダーで、1年を振り返る', card: 'c2', calendar: true, settings: { accent: 'ai' }, run: async w => { w.show('log'); } },
  night:    { h: '紙も文字も、自分好みに', p: '6種の紙、明朝、縦書き、ダークモード', card: 'c2', night: true, settings: { paper: 'sumi', accent: 'kincha', font: 'mincho', vert: true, theme: 'dark' }, run: async w => {} },
};

function layout() {
  const W = innerWidth, H = innerHeight, base = Math.min(W * 0.064, H * 0.031);
  const cap = document.querySelector('.cap');
  cap.style.paddingTop = (H * 0.05) + 'px';
  document.getElementById('h').style.fontSize = base + 'px';
  document.getElementById('p').style.fontSize = (base * 0.5) + 'px';
  const top = cap.getBoundingClientRect().bottom + H * 0.035;
  const avail = H - top, scale = Math.min((W * 0.86) / iw, avail / ih);
  const dev = document.getElementById('dev'), f = document.getElementById('app');
  dev.style.width = (iw * scale) + 'px'; dev.style.height = (ih * scale) + 'px'; dev.style.borderRadius = (iw * scale * 0.085) + 'px';
  f.style.width = iw + 'px'; f.style.height = ih + 'px'; f.style.transform = `scale(${scale})`;
}

// make-screenshots.mjs から呼ぶ。場面を仕込んで撮れる状態にする
window.setupScene = async function (name) {
  const sc = SCENES[name]; if (!sc) throw new Error('unknown scene ' + name);
  document.getElementById('h').textContent = sc.h; document.getElementById('p').textContent = sc.p;
  document.body.classList.toggle('night', !!sc.night);
  layout();
  localStorage.setItem('himekuri.v1', JSON.stringify(seedState(sc)));
  const f = document.getElementById('app');
  await new Promise(r => { f.onload = r; f.src = '../index.html'; });
  const w = f.contentWindow, doc = w.document;
  for (let i = 0; i < 100 && !doc.querySelector('#sheet .day'); i++) await sleep(50); // init() の描画を待つ
  await sleep(200);
  if (sc.compact) { const st = doc.createElement('style'); st.textContent = '.pad{height:46vh !important;min-height:320px !important}'; doc.head.appendChild(st); }
  if (!sc.notes && !sc.calendar) { const st = doc.createElement('style'); st.textContent = '.memories{visibility:hidden}'; doc.head.appendChild(st); } // 思い出が無い場面は、下の案内文を見せない
  await sc.run(w);
  // 動きの途中で撮らないように、アニメーションを止めて最終状態にする
  const st2 = doc.createElement('style'); st2.textContent = '*{animation:none !important;transition:none !important}'; doc.head.appendChild(st2);
  doc.getElementById('sheet').className = 'sheet';
  doc.getElementById('toast').classList.remove('show');
  await sleep(500);
  return { scene: name, day: doc.querySelector('#sheet .day')?.textContent, screen: doc.querySelector('.screen.active')?.id, text: (doc.querySelector('#sheet .sheet-text')?.textContent || '').slice(0, 20) };
};
if (q.get('scene')) setupScene(q.get('scene'));
</script>
</body>
</html>
